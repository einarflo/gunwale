version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=din.epost@domene.no
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`media.tavl.no`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=le"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      # MinIO Console (admin UI) on :9001
      - "traefik.http.routers.minio-console.rule=Host(`console.media.tavl.no`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=le"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      - "traefik.docker.network=web"
    networks:
      - web

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=12h
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - web

  challenger-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=changeme
      - MYSQL_DATABASE=challenger
      - MYSQL_USER=challenger
      - MYSQL_PASSWORD=challenger
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - challenger_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uchallenger -pchallenger --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - web

  challenger:
    build: ./challenger
    restart: unless-stopped
    depends_on:
      challenger-db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TIMEOUT_MS=120000
      - OLLAMA_NUM_THREAD=12
      - CHALLENGER_DATABASE_URL=mysql://challenger:challenger@141.95.18.208:3306/challenger
      - MYSQL_HOST=challenger-db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=challenger
      - MYSQL_USER=challenger
      - MYSQL_PASSWORD=challenger
      - LOG_LEVEL=debug
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.challenger.rule=Host(`ai.tavl.no`)"
      - "traefik.http.routers.challenger.entrypoints=websecure"
      - "traefik.http.routers.challenger.tls=true"
      - "traefik.http.routers.challenger.tls.certresolver=le"
      - "traefik.http.services.challenger.loadbalancer.server.port=3000"
    networks:
      - web

  postlady:
    build:
      context: ./postlady
    restart: unless-stopped
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postlady.rule=Host(`postlady.tech`)"
      - "traefik.http.routers.postlady.entrypoints=websecure"
      - "traefik.http.routers.postlady.tls=true"
      - "traefik.http.routers.postlady.tls.certresolver=le"
      - "traefik.http.services.postlady.loadbalancer.server.port=80"
      - "traefik.docker.network=web"
    volumes:
      - ./postlady/public/downloads:/usr/share/nginx/html/downloads:ro
    networks:
      - web


volumes:
  ollama_models:
  challenger_db:
  traefik_letsencrypt:
  minio_data:

networks:
  web:
    driver: bridge
